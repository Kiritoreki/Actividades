<style>

@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: columna de trabajo para el teléfono — lista de actividades o formulario por pasos, barra de copiar fija abajo */
:root{
  --bg:#f1f3f6; --card:#ffffff; --fg:#141a22; --muted:#5a6575; --line:#d8dde5; --field:#f7f8fa;
  --red:#c8322a; --red-soft:#fbe4e2; --ok:#1d7a4f; --ok-soft:#dff1e7; --warn:#a86a00; --warn-soft:#fbefd6; --accent:#1f5fbf; --accent-soft:#e1ebfa; --on-color:#ffffff;
  --sans:"Barlow",system-ui,sans-serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --card:#18202a; --fg:#e6ebf2; --muted:#93a0b2; --line:#2a3542; --field:#121922;
  --red:#ff6b5f; --red-soft:#3a1d1b; --ok:#5ccf93; --ok-soft:#173226; --warn:#f0b24a; --warn-soft:#3a2c12; --accent:#7fb0ff; --accent-soft:#1a2a44; --on-color:#0f141b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202a; --fg:#e6ebf2; --muted:#93a0b2; --line:#2a3542; --field:#121922;
  --red:#ff6b5f; --red-soft:#3a1d1b; --ok:#5ccf93; --ok-soft:#173226; --warn:#f0b24a; --warn-soft:#3a2c12; --accent:#7fb0ff; --accent-soft:#1a2a44; --on-color:#0f141b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans)}
.wrap{max-width:680px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 26px var(--cond);letter-spacing:.02em;margin:0;text-transform:uppercase}
h2{font:700 15px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--red);border-color:var(--red);color:var(--on-color);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.new{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.day{display:grid;gap:8px}
.day>h2{text-transform:none}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px}
.item b{display:block;font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--muted);font:400 13px var(--mono)}
.badge{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}
.b-inst{background:var(--accent-soft);color:var(--accent)}
.b-tv{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;color:var(--muted);text-align:center}
.muted{color:var(--muted);font-size:14px}
/* editor */
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.step{font:700 13px var(--mono);color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,textarea{font:16px var(--sans);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.mono{font-family:var(--mono)!important;font-size:15px!important}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.unit{position:relative}.unit input{padding-right:48px}.unit span{position:absolute;right:10px;bottom:10px;font:13px var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:8px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.num{display:inline-flex;gap:8px;align-items:center;padding:6px 12px}.chip.num b{color:var(--red)}
.chip.no[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin:0}
.chk span{min-width:0}
.chk small{display:block;color:var(--muted);font-size:13px}
.list-chk{display:grid;gap:2px}
.progress{font:600 13px var(--mono)}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--field)}
.box h3{margin:0;font:700 14px var(--cond);letter-spacing:.06em;text-transform:uppercase}
pre.report{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 var(--mono);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar-in .primary{flex:1;padding:14px}
.bar .note{font-size:13px;color:var(--muted);max-width:40%}
.danger{color:var(--red);border-color:var(--red)}
.saved{font:12px var(--mono);color:var(--muted)}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:9;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.update button{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;padding:6px 12px}
.pastebtn{justify-self:start}
</style>
</head>
<body>
<div class="update" id="upd" hidden><span>Hay una versión nueva</span><button id="updBtn">Actualizar</button></div>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="bar-in"><span class="note" id="miss"></span><button class="primary" id="copy">Copiar reporte</button></div></div>
<textarea id="clip" aria-hidden="true" style="position:fixed;left:-9999px;top:0;opacity:0"></textarea>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const fDay=k=>{const t=new Date(k+"T12:00").toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long",year:"numeric"});return t[0].toUpperCase()+t.slice(1)};

const ROUTER=[
 ["remoto","Acceso remoto activado"],
 ["b24","Banda 2.4 GHz a 40 MHz"],
 ["b5","Banda 5 GHz a 80 MHz"],
 ["upd","Actualización automática a las 3:00 a. m."],
 ["unif","Unificar bandas"],
 ["adv","Wi-Fi › Opciones avanzadas: últimos parámetros activados"]];
const EVID=[
 ["napC","NAP cerrada, con su etiqueta"],
 ["napA","NAP abierta / intervención"],
 ["potA","Potencia antes"],
 ["potD","Potencia final (power meter)"],
 ["equipo","Equipo nuevo: caja con S/N y MAC","eq"],
 ["inst","Instalación final (ONU y router)"],
 ["trace","Traceroute"],["ping","Ping"],["speed","Speed test"]];
const EVID_I=[
 ["nap","NAP con su etiqueta"],
 ["napA","NAP abierta / hilo usado"],
 ["equipo","Cajas de equipos: MAC y GPON SN","eq"],
 ["pot","Potencia (power meter)"],
 ["inst","Instalación final (ONU y router)"],
 ["speed","Speed test"]];
const TIPOS={foco_rojo:["Foco rojo","b-red"],instalacion:["Inst. alámbrica","b-inst"],tv:["App de TV","b-tv"]};
const TVSO=[["android","Android TV / Google TV"],["webos","webOS"],["tizen","Tizen"],["vidaa","VIDAA"],["roku","Roku TV"],["otro","No sé"]];
const NOAPK={webos:1,tizen:1,vidaa:1,roku:1};
const MARCAS=[["Samsung","tizen"],["LG","webos"],["Sony","android"],["Xiaomi","android"],["TCL",""],["Hisense",""],["Philips",""],["Panasonic",""],["Motorola","android"],["Hyundai",""],["Riviera",""],["Challenger",""],["JVC",""],["Otra",""]];
const MARCA_TIP={TCL:"Puede ser Google TV o Roku",Hisense:"Puede ser VIDAA o Google TV",Philips:"Puede ser Android TV o Saphi",Panasonic:"Puede ser Android TV o propio",Riviera:"Muchos son Android TV",Challenger:"Muchos son Android TV",JVC:"Puede ser Android TV o Roku",Hyundai:"Puede ser Android TV o VIDAA",Otra:"Revisa el sistema abajo"};
const TVSTEPS=[
 ["fuentes","Activar «Fuentes desconocidas»","Ajustes › Seguridad/Privacidad; en Google TV, permitir que el instalador instale apps"],
 ["cred","Pedir usuario y contraseña a Michelle",""],
 ["login","Ingresar usuario y contraseña y probar canales",""],
 ["explicar","Explicar al cliente cómo usarla",""]];
const tvApps=()=>[...new Set(["IPTV Smarters Pro",...acts.filter(a=>a.tipo==="tv"&&a.tvApp).map(a=>a.tvApp)])];
function reportTV(a){
  const tec=[a.tecnico,a.tecnico2].filter(Boolean).join(" y ");
  const appTxt=a.tvApp?(a.tvApp+(a.tvMarca&&a.tvMarca!=="Otra"?" en TV "+a.tvMarca:"")):"";
  const bloq=NOAPK[a.tvSO]&&!a.tvBox;
  const work=(a.trabajo||"").split(/\r?\n/).map(t=>t.replace(/^[\s*•\-✅⚪️]+/u,"").trim()).filter(Boolean);
  if(a.tvFmt==="rapido"){
    const L=[];if(tec)L.push("Técnico: "+tec);
    if(a.soporte)L.push("soporte, "+a.soporte);if(a.cliente)L.push("cliente, "+a.cliente);if(a.tel)L.push("tel. "+a.tel);if(a.direccion)L.push("dirección, "+a.direccion);
    if(a.extra)L.push(...a.extra.split("\n"));
    const S=work.map(x=>"✅"+x);
    if(bloq)S.push("✅El televisor no permite instalar la aplicación; se recomienda adquirir un TV Box Android o un Fire TV Stick");
    else if(appTxt)S.push("✅Se realizó la instalación de la app "+appTxt);
    const n=notifLines(a);if(n.length){S.push("✅Notificación al cliente: "+n[0]);for(const x of n.slice(1))S.push("✅"+x)}
    return L.join("\n")+(S.length?"\nSe realizó con lo siguiente\n"+S.join("\n\n"):"");
  }
  const L=["ACTIVIDAD: Instalación de app de canales de TV"];const add=(k,v)=>{if(String(v||"").trim())L.push(k+": "+String(v).trim())};
  add("Fecha",fechaLarga(dayKey(a.creado)));
  if(tec)L.push("Técnico: "+tec);
  add("Cliente",a.cliente);add("Dirección",a.direccion);add("Telef",a.tel);
  if(a.plan)L.push("Plan: "+(/^\d+$/.test(a.plan.trim())?a.plan.trim()+" Mbps":a.plan.trim()));
  const N=[];
  if(bloq)N.push("* El televisor no permite instalar la aplicación; se recomienda al cliente adquirir un TV Box Android o un Fire TV Stick.");
  else if(appTxt)N.push("* Se instala la app de canales de TV "+appTxt+".");
  for(const x of work)N.push("* "+x);
  for(const t of (a.notas||"").split(/\r?\n/)){const x=t.replace(/^[\s*•\-]+/,"").trim();if(x)N.push("* "+x)}
  if(N.length)L.push("Notas:",...N);
  {const n=notifLines(a);if(n.length)L.push("Notificación al cliente:",...n.map(x=>"* "+x))}
  return L.join("\n");
}

let offReady=false,acts=[],col=null,cur=null,q="",confirmDel=false,saveT=null,LS="actividades.v1";

function blank(tipo="foco_rojo"){const inst=tipo==="instalacion";return{tipo,creado:Date.now(),estado:"pendiente",pegado:"",tecnico:"",tecnico2:"",soporte:"",cliente:"",direccion:"",tel:"",ip:"",extra:"",
 fibra:false,metros:"",onu:false,onuAnt:"",onuNueva:"",router:false,routerAnt:"",routerNueva:"",rchk:{},
 nap:"",napInterv:"",potAntes:"",potDespues:"",trabajo:"",tests:true,clienteOk:true,cumplida:true,evid:{},
 tvFmt:"formal",cedula:"",correo:"",hilo:"",hilosLibres:"",mac:"",gpon:"",pot:"",plan:"",notas:"",pruebas:true,fecha:"",...(inst?{router:true,onu:true,fibra:true}:{})}}

/* --- leer el mensaje que llega --- */
function parse(txt){
  const out={tecnico:"",soporte:"",cliente:"",direccion:"",tel:"",ip:"",cedula:"",correo:"",plan:"",nap:"",extra:[]};
  const MAPRE=/(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|g\.co\/kgs)\S*/gi;
  out.mapa="";
  for(const raw of txt.split(/\r?\n/)){let l=raw.trim();if(!l)continue;
    const mm=l.match(MAPRE);if(mm){if(!out.mapa)out.mapa=mm[0].startsWith("http")?mm[0]:"https://"+mm[0];l=l.replace(MAPRE,"").trim();
      if(!l||/^(ubicaci[oó]n|ubicaci[oó]n del cliente|maps?|google maps|link|enlace|direcci[oó]n en maps)\s*[,.:]*$/i.test(l))continue;l=l.replace(/[\s,.:\-]+$/,"");if(!l)continue}
    const m=l.match(/^(t[eé]cnicos?|soporte|cliente|direcci[oó]n|tel[eé]fono|tel[eé]f|tel|celular|cel|ip|c[eé]dula|correo(?: electr[oó]nico)?|plan|nap)\s*[,.:]+\s*(.*)$/i);
    if(!m){if(!/^instalaci[oó]n\.?$/i.test(l))out.extra.push(l);continue}
    const k=m[1].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const key=k.startsWith("tecnico")?"tecnico":k.startsWith("direc")?"direccion":/^(tel|cel)/.test(k)?"tel":k.startsWith("correo")?"correo":k;
    out[key]=m[2].trim();}
  out.extra=out.extra.join("\n");return out;
}

/* --- reporte para WhatsApp --- */
const neg=v=>{v=String(v).trim().replace(",",".");if(!v)return"";return v.startsWith("-")?v:"-"+v};
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function fechaLarga(k){const d=new Date(k+"T12:00");const w=d.toLocaleDateString("es-EC",{weekday:"long"});return w[0].toUpperCase()+w.slice(1)+", "+d.getDate()+" de "+MES[d.getMonth()]+" del "+d.getFullYear()}
function reportInst(a){
  const L=["ACTIVIDAD: Instalación nueva."];const add=(k,v)=>{if(String(v||"").trim())L.push(k+": "+String(v).trim())};
  add("Fecha",fechaLarga(a.fecha||dayKey(a.creado)));
  const tec=[a.tecnico,a.tecnico2].filter(Boolean).join(" y ");if(tec)L.push("Técnico: "+tec+".");
  add("Cliente",a.cliente);add("Dirección",a.direccion);add("Cédula",a.cedula);add("Telef",a.tel);if(a.correoEstado==="no")L.push("Correo electrónico: El cliente no cuenta con correo electrónico.");else add("Correo electrónico",a.correo);
  add("IP",a.ip);add("NAP",a.nap);add("HILO",a.hilo);add("HILOS LIBRES",a.hilosLibres);add("Mac ONT ACTUAL",a.mac);add("GPON SN",a.gpon);
  if(a.pot)L.push("Potencia: "+neg(a.pot)+" dBm");
  if(a.plan)L.push("Plan: "+(/^\d+$/.test(a.plan.trim())?a.plan.trim()+" Mbps":a.plan.trim()));
  const N=[];
  if(a.metros)N.push(`* Se utilizan ${a.metros} metros de cable de fibra óptica desde la NAP hasta el domicilio del cliente.`);
  if(a.router&&a.onu)N.push("* Router y bridge nuevos.");else if(a.router)N.push("* Router nuevo.");else if(a.onu)N.push("* Bridge nuevo.");
  if(a.pruebas)N.push("* Se realizan pruebas de potencia y test de velocidad, el cliente cuenta con servicio de internet.");
  for(const t of (a.notas||"").split(/\r?\n/)){const x=t.replace(/^[\s*•\-]+/,"").trim();if(x)N.push("* "+x)}
  if(N.length)L.push("Notas:",...N);
  {const n=notifLines(a);if(n.length)L.push("Notificación al cliente:",...n.map(x=>"* "+x))}
  return L.join("\n");
}
function report(a){
  if(a.tipo==="instalacion")return reportInst(a);
  if(a.tipo==="tv")return reportTV(a);
  const L=[];const tec=[a.tecnico,a.tecnico2].filter(Boolean).join(" y ");
  if(tec)L.push("Tecnico, "+tec);
  if(a.soporte)L.push("soporte, "+a.soporte);
  if(a.cliente)L.push("cliente, "+a.cliente);
  if(a.direccion)L.push("dirección, "+a.direccion);
  if(a.tel)L.push("tel. "+a.tel);
  if(a.ip)L.push("ip, "+a.ip);
  if(a.extra)L.push(...a.extra.split("\n"));
  const S=[];
  for(const t of (a.trabajo||"").split(/\r?\n/)){const x=t.replace(/^[\s⚪️•\-*]+/u,"").trim();if(x)S.push("⚪️"+x)}
  if(a.fibra&&a.metros)S.push(`⚪️se pasaron ${a.metros} m de drop`);
  if(a.napInterv==="si")S.push("⚪️se intervino en la NAP"+(a.nap?" "+a.nap:""));
  if(a.napInterv==="no")S.push("⚪️no se intervino en la NAP"+(a.nap?" "+a.nap:""));
  if(a.potAntes)S.push(`⚪️potencia antes ${neg(a.potAntes)} dBm`);
  if(a.potDespues)S.push(`⚪️potencia después ${neg(a.potDespues)} dBm`);
  if(a.tests)S.push("⚪️Realización de los distintos test");
  if(a.clienteOk)S.push("⚪️Cliente comprueba y todo Ok");
  if(a.onu){S.push("⚪️Cambio de nueva bridge");if(a.onuAnt)S.push("⚪️MAC bridge anterior: "+a.onuAnt);if(a.onuNueva)S.push("⚪️MAC bridge nueva: "+a.onuNueva)}
  if(a.router){S.push("⚪️Cambio de router");if(a.routerAnt)S.push("⚪️MAC router anterior: "+a.routerAnt);if(a.routerNueva)S.push("⚪️MAC router nuevo: "+a.routerNueva)}
  {const n=notifLines(a);if(n.length){S.push("⚪️Notificación al cliente: "+n[0]);for(const x of n.slice(1))S.push("⚪️"+x)}}
  if(a.cumplida)S.push("✅se cumplió con la actividad");

}

  const i=acts.findIndex(a=>a.id===id);if(i>=0)acts[i]={...cur};
  try{saveLocal();const s=$("saved");if(s)s.textContent="Guardado "+hhmm(Date.now())}
  catch{const s=$("saved");if(s)s.textContent="No se pudo guardar: el teléfono no tiene espacio."}}
async function remove(id){acts=acts.filter(a=>a.id!==id);saveLocal()}

async function newAct(tipo){
  const a=blank(tipo);let id="l"+a.creado;
  cur={id,...a};acts.push({...cur});renderEditor();window.scrollTo(0,0);
  $("f-pegado").focus();await saveNow();
}
async function back(){
  if(cur){const empty=!cur.pegado&&!cur.cliente&&!cur.trabajo&&!cur.ip&&!cur.notas&&!cur.tvSO;
    if(empty)await remove(cur.id).catch(()=>{});else await saveNow();}
  cur=null;renderList();window.scrollTo(0,0);
}

/* --- eventos --- */
document.addEventListener("input",e=>{
  if(!cur)return;const t=e.target;
  if(t.dataset.k){let v=t.value;
    if(/^(onuAnt|onuNueva|routerAnt|routerNueva|nap|mac|gpon)$/.test(t.dataset.k)){const p=t.selectionStart;v=v.toUpperCase();t.value=v;t.setSelectionRange(p,p)}
    cur[t.dataset.k]=v;
    if(t.dataset.k==="pegado"){const p=parse(v);cur.mapa=p.mapa;for(const k of ["tecnico","soporte","cliente","direccion","tel","ip","extra","cedula","correo","plan","nap"]){if(cur.tipo==="instalacion"&&k==="extra")continue;if(!p[k]&&["cedula","correo","plan","nap"].includes(k))continue;cur[k]=p[k];const el=$("f-"+k);if(el)el.value=p[k]}}
    refresh();queueSave();}
});
document.addEventListener("change",e=>{
  if(!cur)return;const t=e.target;if(!t.dataset.c)return;
  if(t.dataset.g){(cur[t.dataset.g]??={})[t.dataset.c]=t.checked}else cur[t.dataset.c]=t.checked;
  refresh();queueSave();
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.new)return newAct(b.dataset.new);
  if(b.dataset.open){const a=acts.find(x=>x.id===b.dataset.open);if(a){cur=JSON.parse(JSON.stringify(a));renderEditor();window.scrollTo(0,0)}return}
  if("back" in b.dataset)return back();
  if(b.dataset.deltel){const n=telNums(cur.tel);n.splice(+b.dataset.deltel,1);cur.tel=n.join(" / ");const el=$("f-tel");if(el)el.value=cur.tel;refresh();queueSave();return}
  if(b.dataset.marca){const m=b.dataset.marca;cur.tvMarca=cur.tvMarca===m?"":m;const so=(MARCAS.find(x=>x[0]===m)||[])[1];if(cur.tvMarca&&so)cur.tvSO=so;renderTV();queueSave();return}
  if(b.dataset.tvapp!==undefined){cur.tvApp=cur.tvApp===b.dataset.tvapp?"":b.dataset.tvapp;document.querySelectorAll("[data-tvapp]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tvapp===cur.tvApp)));refresh();queueSave();return}
  if(b.id==="addApp"){const v=$("newApp").value.trim();if(!v)return;cur.tvApp=v;renderTV();queueSave();return}
  if(b.dataset.tog){const k=b.dataset.tog;cur[k]=!cur[k];b.setAttribute("aria-pressed",String(cur[k]));refresh();queueSave();return}
  if(b.dataset.chip){const k=b.dataset.chip,v=b.dataset.v;cur[k]=(cur[k]===v&&k!=="estado")?"":v;
    if(/^(tvSO|tvBox)$/.test(k)){renderTV();queueSave();return}
    if(k==="tvFmt"&&!cur.tvFmt)cur.tvFmt=v;
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",String(cur[k]===x.dataset.v)));refresh();queueSave();return}
  if(b.id==="del"){if(!confirmDel){confirmDel=true;b.textContent="Toca otra vez para borrar";return}
    const id=cur.id;cur=null;try{await remove(id)}catch{}renderList();return}
});
$("copy").onclick=async()=>{
  if(!cur)return;const txt=report(cur);const btn=$("copy");
  try{await navigator.clipboard.writeText(txt);btn.textContent="Copiado ✓"}
  catch{const c=$("clip");c.value=txt;c.select();c.setSelectionRange(0,txt.length);
    try{document.execCommand("copy");btn.textContent="Copiado ✓"}catch{btn.textContent="Mantén presionado el reporte para copiar"}}
  setTimeout(()=>btn.textContent="Copiar reporte",2200);
  if(cur.estado!=="terminada"&&cur.cumplida){cur.estado="terminada";document.querySelectorAll('[data-chip="estado"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v==="terminada")));queueSave()}
};

/* --- respaldo --- */
async function exportar(){
  const data=JSON.stringify({app:"actividades",version:1,exportado:new Date().toISOString(),actividades:acts},null,1);
  const name="actividades-"+dayKey(Date.now())+".json";
  const file=new File([data],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});$("bkMsg").textContent="Copia lista. Guárdala en Archivos o iCloud.";return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  $("bkMsg").textContent="Copia descargada: "+name;
}
async function importar(f){
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.actividades;if(!Array.isArray(list))throw 0;
    const byId=new Map(acts.map(a=>[a.id,a]));let n=0;
    for(const a of list){if(!a||!a.id)continue;const o=byId.get(a.id);if(!o||(a.actualizado||0)>(o.actualizado||0)){byId.set(a.id,a);n++}}
    acts=[...byId.values()];saveLocal();renderList();$("bkMsg").textContent=`Copia importada: ${n} actividades nuevas o actualizadas.`;
  }catch{$("bkMsg").textContent="Ese archivo no es una copia válida de Actividades."}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="expBtn")return exportar();
  if(b.id==="pasteBtn"){try{const t=await navigator.clipboard.readText();const ta=$("f-pegado");if(!t||!ta)return;ta.value=t;ta.dispatchEvent(new Event("input",{bubbles:true}))}catch{b.textContent="Mantén presionado el cuadro y elige Pegar";setTimeout(()=>b.textContent="Pegar del portapapeles",2500)}}
});
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files[0]){importar(e.target.files[0]);e.target.value=""}});

/* --- arranque --- */
try{acts=JSON.parse(localStorage.getItem(LS)||"[]")}catch{acts=[]}
renderList();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator){
  navigator.serviceWorker.ready.then(()=>{offReady=true;const o=$("offState");if(o)o.textContent="✓ Lista para usar sin internet"});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=w=>{$("upd").hidden=false;$("updBtn").onclick=()=>w.postMessage("skip")};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||!hadCtl)return;reloaded=true;if(cur)saveNow();location.reload()});
}
</script>
