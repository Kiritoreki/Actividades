<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actividades de Campo</title>
<meta name="description" content="Registro personal de actividades técnicas: foco rojo, instalación alámbrica y app de TV.">
<meta name="theme-color" content="#0c0716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Actividades">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Sora";font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#0c0716}
body{margin:0}
/* Layout: columna para el teléfono, siempre oscuro neón; pestañas en barra flotante abajo, copiar en la misma isla */
:root{color-scheme:dark;
  --bg:#0c0716; --card:rgba(22,13,40,.62); --card-solid:#160d28; --fg:#ffffff; --muted:#a99fc4; --line:rgba(255,255,255,.09); --field:rgba(0,0,0,.32);
  --purple:#a855f7; --purple-d:#9333ea; --fuchsia:#e879f9; --pink:#ff2e7a; --cyan:#22d3ee; --green:#2ee88a; --amber:#fbbf24; --orange:#ff8a1f;
  --red:var(--pink); --ok:var(--green); --warn:var(--amber); --accent:var(--purple); --on-color:#ffffff;
  --display:"Sora",system-ui,sans-serif; --sans:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{color:var(--fg);font:16px/1.45 var(--sans);min-height:100vh;
  background:radial-gradient(90% 40% at 0% 0%,rgba(147,51,234,.38),transparent 70%),radial-gradient(70% 35% at 100% 45%,rgba(232,121,249,.16),transparent 70%),radial-gradient(90% 35% at 0% 100%,rgba(34,211,238,.1),transparent 70%),var(--bg);background-attachment:fixed}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 30px/1.08 var(--display);letter-spacing:-.03em;margin:0}
h2{font:600 15px var(--display);letter-spacing:-.01em;color:var(--fg);margin:0}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .15s,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:600}
/* resumen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat b{display:block;font:700 24px var(--display);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.g b{color:var(--green);text-shadow:0 0 12px rgba(46,232,138,.5)}.stat.a b{color:var(--amber)}
/* baldosas de crear */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{--c:var(--purple);border-radius:18px;padding:12px 6px 10px;display:grid;justify-items:center;gap:7px;text-align:center;font-weight:700;font-size:13px;line-height:1.15;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(20,12,36,.6));border:1.5px solid color-mix(in srgb,var(--c) 85%,transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.12)}
.tile:active{box-shadow:0 0 30px var(--c),inset 0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.tile i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 0 14px var(--c)}
.tile.red{--c:var(--pink)}.tile.tv{--c:var(--cyan)}.tile.tv i{color:#03151a}
.searchbox{display:flex;align-items:center;gap:10px;border-radius:14px;padding:0 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.search{flex:1;min-width:0;font:inherit;padding:12px 0;border:0;background:transparent;color:var(--fg);outline:none}
.day{display:grid;gap:10px}
.day-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.day-top h2{margin:0}
.pill,.copyday{--c:var(--fuchsia);display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;
  border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.pill svg,.copyday svg{width:15px;height:15px}
/* historial por mes y día */
details.month,details.dayd{border-radius:20px;background:var(--card);border:1px solid rgba(168,85,247,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
details.dayd{border-radius:18px;background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.09)}
details.dayd[open]{border-color:rgba(232,121,249,.45);box-shadow:0 0 14px rgba(232,121,249,.18)}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;-webkit-tap-highlight-color:transparent}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";font:700 20px/1 var(--display);color:var(--fuchsia);width:14px;transition:transform .15s;text-shadow:0 0 8px rgba(232,121,249,.6)}
details[open]>summary::before{transform:rotate(90deg)}
details>summary .l{flex:1;min-width:0}
details.month>summary .l{font:700 18px var(--display);letter-spacing:-.01em}
.cnt{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.cnt em{font-style:normal;color:var(--amber)}
details.dayd .l .cnt{display:block;margin-top:2px}
.today{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#04140a;background:var(--green);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px;box-shadow:0 0 8px rgba(46,232,138,.5)}
.mdays{padding:0 10px 10px;display:grid;gap:10px}
.dbody{padding:0 10px 12px;display:grid;gap:10px}
.dtools{display:flex;justify-content:flex-end}
/* tarjetas */
.item{--c:var(--purple);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:18px;
  background:var(--card);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 16%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.item.t-foco_rojo{--c:var(--pink)}.item.t-tv{--c:var(--cyan)}
.item .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.item b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.item small{color:#ddd5f2;font:400 12.5px var(--mono)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d);box-shadow:0 0 8px var(--d)}
.st.ok{--d:var(--green);color:#bff7d8}.st.wait{--d:var(--amber);color:#fde7a8}
.empty{background:var(--card);border:1px dashed rgba(168,85,247,.45);border-radius:18px;padding:24px 16px;color:var(--muted);text-align:center}
.muted{color:var(--muted);font-size:14px}
/* barra flotante (pestañas o copiar) */
.dock,.bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;
  max-width:656px;margin:0 auto;border-radius:24px;padding:8px;display:flex;gap:8px;align-items:center;
  background:rgba(20,12,36,.72);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.dock button{flex:1;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:16px;background:transparent;border:0}
.dock button[aria-current="page"]{color:#fff;background:rgba(168,85,247,.22);box-shadow:inset 0 0 0 1px rgba(192,132,252,.5),0 0 14px rgba(168,85,247,.35)}
.bar-in{display:flex;gap:10px;align-items:center;width:100%}
.bar .note{font-size:12.5px;font-weight:700;color:var(--amber);max-width:42%;padding-left:6px;line-height:1.25}
.bar .note.ok{color:var(--green)}
.primary{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;border-radius:18px;padding:14px;font:700 15px var(--display);color:#fff;border:0;
  background:linear-gradient(135deg,var(--purple-d),var(--fuchsia));box-shadow:0 0 18px rgba(232,121,249,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.primary.ready{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(232,121,249,1),0 0 70px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.35)}}
@media (prefers-reduced-motion:reduce){.primary.ready{animation:none}}
/* editor */
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px 8px 8px;border-radius:99px;font-weight:700;font-size:14px}
.sec{background:var(--card);border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:16px;display:grid;gap:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-h h2{font-size:16px}
.step{font:700 12px var(--mono);color:var(--fuchsia);background:rgba(232,121,249,.12);border:1px solid rgba(232,121,249,.4);border-radius:99px;padding:2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,textarea,select{font:16px var(--sans);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#6f6590}
.mono{font-family:var(--mono)!important;font-size:15px!important}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.unit{position:relative}.unit input{padding-right:52px}.unit span{position:absolute;right:12px;bottom:11px;font:13px var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(168,85,247,.35);color:#e9e2fb}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(168,85,247,.55),rgba(147,51,234,.35));border-color:#c084fc;color:#fff;box-shadow:0 0 12px rgba(168,85,247,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.no[aria-pressed="true"]{background:rgba(251,191,36,.18);border-color:var(--amber);color:#fde68a;box-shadow:0 0 12px rgba(251,191,36,.4)}
.chip.num{display:inline-flex;gap:8px;align-items:center;padding:6px 12px}.chip.num b{color:var(--pink)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 2px;cursor:pointer;font-weight:500}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:0;border-radius:50%;border:2px solid rgba(168,85,247,.6);background:rgba(0,0,0,.3);display:grid;place-items:center;transition:.15s}
.chk input:checked{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(46,232,138,.6)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #04140a;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.chk span{min-width:0}
.chk small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.list-chk{display:grid;gap:2px}
.progress{font:700 12px var(--mono);color:var(--green);background:rgba(46,232,138,.12);border:1px solid rgba(46,232,138,.45);border-radius:99px;padding:3px 9px}
.box{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:rgba(0,0,0,.22)}
.box h3{margin:0;font:600 14px var(--display)}
pre.report{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.55 var(--mono);background:rgba(0,0,0,.38);border:1px solid var(--line);border-radius:16px;padding:12px;color:#fff}
.danger{color:#ff8fb5;border:1.5px solid var(--pink);background:rgba(255,46,122,.1);box-shadow:0 0 10px rgba(255,46,122,.35)}
.saved{font:12px var(--mono);color:var(--muted)}
a{color:var(--fuchsia)}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{cursor:pointer;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
.offok{color:var(--green);font-weight:700}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:9;background:rgba(20,12,36,.9);border:1px solid rgba(232,121,249,.6);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 0 20px rgba(232,121,249,.45);max-width:calc(100% - 32px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.update button{background:linear-gradient(135deg,var(--purple-d),var(--fuchsia));border:0;color:#fff;font-weight:700;padding:6px 12px;border-radius:10px}
.pastebtn{justify-self:start;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="update" id="upd" hidden><span>Hay una versión nueva</span><button id="updBtn">Actualizar</button></div>
<div class="wrap" id="app"></div>
<nav class="dock" id="dock" aria-label="Secciones"></nav>
<div class="bar" id="bar" hidden><div class="bar-in"><span class="note" id="miss"></span><button class="primary" id="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copiar reporte</span></button></div></div>
<textarea id="clip" aria-hidden="true" style="position:fixed;left:-9999px;top:0;opacity:0"></textarea>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const fDay=k=>{const t=new Date(k+"T12:00").toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long",year:"numeric"});return t[0].toUpperCase()+t.slice(1)};

const ROUTER=[
 ["remoto","Acceso remoto activado"],
 ["b24","Banda 2.4 GHz a 40 MHz"],
 ["b5","Banda 5 GHz a 80 MHz"],
 ["upd","Actualización automática a las 3:00 a. m."],
 ["unif","Unificar bandas"],
 ["adv","Wi-Fi › Opciones avanzadas: últimos parámetros activados"]];
const EVID=[
 ["napC","NAP cerrada, con su etiqueta"],
 ["napA","NAP abierta / intervención"],
 ["potA","Potencia antes"],
 ["potD","Potencia final (power meter)"],
 ["equipo","Equipo nuevo: caja con S/N y MAC","eq"],
 ["inst","Instalación final (ONU y router)"],
 ["trace","Traceroute"],["ping","Ping"],["speed","Speed test"],
 ["stRoseta","Sticker en la roseta"],["stRouter","Sticker en el router"],["stBridge","Sticker en el bridge"]];
const EVID_I=[
 ["nap","NAP con su etiqueta"],
 ["napA","NAP abierta / hilo usado"],
 ["equipo","Cajas de equipos: MAC y GPON SN","eq"],
 ["pot","Potencia (power meter)"],
 ["inst","Instalación final (ONU y router)"],
 ["speed","Speed test"],
 ["stRoseta","Sticker en la roseta"],["stRouter","Sticker en el router"],["stBridge","Sticker en el bridge"]];
const TIPOS={foco_rojo:["Foco rojo","b-red"],instalacion:["Inst. alámbrica","b-inst"],tv:["App de TV","b-tv"]};
const TVSO=[["android","Android TV / Google TV"],["webos","webOS"],["tizen","Tizen"],["vidaa","VIDAA"],["roku","Roku TV"],["otro","No sé"]];
const NOAPK={webos:1,tizen:1,vidaa:1,roku:1};
const MARCAS=[["Samsung","tizen"],["LG","webos"],["Sony","android"],["Xiaomi","android"],["TCL",""],["Hisense",""],["Philips",""],["Panasonic",""],["Motorola","android"],["Hyundai",""],["Riviera",""],["Challenger",""],["JVC",""],["Otra",""]];
const MARCA_TIP={TCL:"Puede ser Google TV o Roku",Hisense:"Puede ser VIDAA o Google TV",Philips:"Puede ser Android TV o Saphi",Panasonic:"Puede ser Android TV o propio",Riviera:"Muchos son Android TV",Challenger:"Muchos son Android TV",JVC:"Puede ser Android TV o Roku",Hyundai:"Puede ser Android TV o VIDAA",Otra:"Revisa el sistema abajo"};
const TVSTEPS=[
 ["fuentes","Activar «Fuentes desconocidas»","Ajustes › Seguridad/Privacidad; en Google TV, permitir que el instalador instale apps"],
 ["cred","Pedir usuario y contraseña a Michelle",""],
 ["login","Ingresar usuario y contraseña y probar canales",""],
 ["explicar","Explicar al cliente cómo usarla",""]];
const tvApps=()=>[...new Set(["IPTV Smarters Pro",...acts.filter(a=>a.tipo==="tv"&&a.tvApp).map(a=>a.tvApp)])];
function reportTV(a){
  const tec=[a.tecnico,a.tecnico2].filter(Boolean).join(" y ");
  const appTxt=a.tvApp?(a.tvApp+(a.tvMarca&&a.tvMarca!=="Otra"?" en TV "+a.tvMarca:"")):"";
  const bloq=NOAPK[a.tvSO]&&!a.tvBox;
  const work=(a.trabajo||"").split(/\r?\n/).map(t=>t.replace(/^[\s*•\-✅⚪️]+/u,"").trim()).filter(Boolean);
  if(a.tvFmt==="rapido"){
    const L=[];if(tec)L.push("Técnico: "+tec);
    if(a.soporte)L.push("soporte, "+a.soporte);if(a.cliente)L.push("cliente, "+a.cliente);if(a.tel)L.push("tel. "+a.tel);if(a.direccion)L.push("dirección, "+a.direccion);
    if(a.extra)L.push(...a.extra.split("\n"));
    const S=work.map(x=>"✅"+x);
    if(bloq)S.push("✅El televisor no permite instalar la aplicación; se recomienda adquirir un TV Box Android o un Fire TV Stick");
    else if(appTxt)S.push("✅Se realizó la instalación de la app "+appTxt);
    const n=notifLines(a);if(n.length){S.push("✅Notificación al cliente: "+n[0]);for(const x of n.slice(1))S.push("✅"+x)}
    return L.join("\n")+(S.length?"\nSe realizó con lo siguiente\n"+S.join("\n\n"):"");
  }
  const L=["ACTIVIDAD: Instalación de app de canales de TV"];const add=(k,v)=>{if(String(v||"").trim())L.push(k+": "+String(v).trim())};
  add("Fecha",fechaLarga(dayKey(a.creado)));
  if(tec)L.push("Técnico: "+tec);
  add("Cliente",a.cliente);add("Dirección",a.direccion);add("Telef",a.tel);

function parse(txt){
  const out={tecnico:"",soporte:"",cliente:"",direccion:"",tel:"",ip:"",cedula:"",correo:"",plan:"",nap:"",extra:[]};
  const MAPRE=/(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|g\.co\/kgs)\S*/gi;
  out.mapa="";
  for(const raw of txt.split(/\r?\n/)){let l=raw.trim();if(!l)continue;
    const mm=l.match(MAPRE);if(mm){if(!out.mapa)out.mapa=mm[0].startsWith("http")?mm[0]:"https://"+mm[0];l=l.replace(MAPRE,"").trim();
      if(!l||/^(ubicaci[oó]n|ubicaci[oó]n del cliente|maps?|google maps|link|enlace|direcci[oó]n en maps)\s*[,.:]*$/i.test(l))continue;l=l.replace(/[\s,.:\-]+$/,"");if(!l)continue}
    const m=l.match(/^(t[eé]cnicos?|soporte|cliente|direcci[oó]n|tel[eé]fono|tel[eé]f|tel|celular|cel|ip|c[eé]dula|correo(?: electr[oó]nico)?|plan|nap)\s*[,.:]+\s*(.*)$/i);
    if(!m){if(!/^instalaci[oó]n\.?$/i.test(l))out.extra.push(l);continue}
    const k=m[1].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const key=k.startsWith("tecnico")?"tecnico":k.startsWith("direc")?"direccion":/^(tel|cel)/.test(k)?"tel":k.startsWith("correo")?"correo":k;
    out[key]=m[2].trim();}
  out.extra=out.extra.join("\n");return out;
}

const notifHTML=()=>`<section class="sec"><div class="sec-h"><h2>Notificación al cliente</h2></div>
    <div class="chips">${chip("notif","si","Hay notificación")}${chip("notif","no","No hay","no")}</div>
    <label class="f" id="notifBox" ${cur.notif==="si"?"":"hidden"}>¿Qué se le indicó al cliente?<textarea id="f-notifTxt" data-k="notifTxt" placeholder="El cliente debe…">${esc(cur.notifTxt)}</textarea></label></section>`;
const notifLines=a=>a.notif==="si"?(a.notifTxt||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[];
function renderTV(){
  const so=cur.tvSO, bloq=NOAPK[so]&&!cur.tvBox, sigue=so&&(!NOAPK[so]||cur.tvBox)&&so!=="otro";
  const done=TVSTEPS.filter(([k])=>cur.tvchk?.[k]).length;
  const appChip=v=>`<button class="chip" data-tvapp="${esc(v)}" aria-pressed="${cur.tvApp===v}">${esc(v)}</button>`;
  $("app").innerHTML=`
  <div class="top"><button class="back" data-back>${ICON.back}Actividades</button><span class="saved" id="saved"></span></div>
  <div class="top"><h1>App de TV</h1><div class="chips">${chip("estado","pendiente","Pendiente","no")}${chip("estado","terminada","Terminada")}</div></div>
  <section class="sec"><div class="sec-h"><h2>Datos de la actividad</h2></div>
    <label class="f">Pega aquí el mensaje que te llega<textarea id="f-pegado" data-k="pegado" placeholder="soporte, colocar app de TV&#10;cliente, …&#10;tel. …&#10;dirección, …">${esc(cur.pegado)}</textarea></label>
    <button class="pastebtn" id="pasteBtn">Pegar del portapapeles</button>
    <div class="grid">${inp("tecnico","Técnico")}${inp("tecnico2","Segundo técnico",{attrs:'placeholder="Opcional"'})}
    ${inp("cliente","Cliente",{cls:"full"})}${inp("direccion","Dirección",{cls:"full"})}
    ${inp("tel","Teléfono",{attrs:'inputmode="tel" class="mono"'})}${inp("plan","Plan",{unit:"Mbps",attrs:'inputmode="numeric" class="mono" placeholder="200"'})}
    <div class="chips full" id="telChips"></div></div></section>

  <section class="sec"><div class="sec-h"><h2>1 · Marca del televisor</h2></div>
    <div class="chips">${MARCAS.map(([m])=>`<button class="chip" data-marca="${m}" aria-pressed="${cur.tvMarca===m}">${m}</button>`).join("")}</div>
    ${cur.tvMarca&&MARCA_TIP[cur.tvMarca]?`<p class="muted" style="margin:0">${MARCA_TIP[cur.tvMarca]}. Confirma el sistema:</p>`:""}
    <h2 style="margin-top:4px">Sistema</h2>
    <div class="chips">${TVSO.map(([v,l])=>chip("tvSO",v,l)).join("")}</div>
    ${so==="otro"?`<div class="box"><p style="margin:0">Revisa Ajustes › Información del TV. Si en el menú aparece <b>Google Play</b>, es Android TV / Google TV.</p></div>`:""}
    ${NOAPK[so]?`<div class="box" style="border-color:var(--warn)"><h3 style="color:var(--warn)">Este TV no instala la app</h3>
      <p style="margin:0">Recomienda al cliente comprar un <b>TV Box Android</b> o un <b>Fire TV Stick</b>. Si ya tiene uno, elige cuál y sigue:</p>
      <div class="chips">${chip("tvBox","box","Tiene TV Box Android")}${chip("tvBox","fire","Tiene Fire TV Stick")}</div></div>`:""}
  </section>

  ${sigue?`<section class="sec"><div class="sec-h"><h2>2 · Instalador</h2></div>
    <div class="chips">${chip("tvInst","Downloader","Downloader")}${chip("tvInst","Uptodown","Uptodown")}</div></section>

  <section class="sec"><div class="sec-h"><h2>3 · App de IPTV</h2></div>
    <div class="chips">${tvApps().map(appChip).join("")}${cur.tvApp&&!tvApps().includes(cur.tvApp)?appChip(cur.tvApp):""}</div>
    <div style="display:flex;gap:8px"><input id="newApp" class="search" placeholder="Otra app que pida la empresa" style="flex:1;min-width:0"><button id="addApp">Agregar</button></div></section>

  <section class="sec"><div class="sec-h"><h2>4 · Pasos</h2><span class="progress" id="tvprog">${done}/${TVSTEPS.length}</span></div>
    <div class="list-chk">${TVSTEPS.map(([k,l,sub])=>chk(k,l,sub,"tvchk")).join("")}</div></section>`:""}

  <section class="sec"><div class="sec-h"><h2>Trabajo realizado</h2></div>
    <label class="f">Una línea por punto (ej. se restableció el TV de fábrica)<textarea id="f-trabajo" data-k="trabajo">${esc(cur.trabajo)}</textarea></label></section>
  ${notifHTML()}
  <section class="sec"><div class="sec-h"><h2>Reporte</h2></div>
    <div class="chips">${chip("tvFmt","formal","Formato ACTIVIDAD")}${chip("tvFmt","rapido","Formato rápido ✅")}</div>
    <pre class="report" id="rep"></pre></section>
  <div class="top"><span class="muted">Creada ${fDay(dayKey(cur.creado))}, ${hhmm(cur.creado)}</span><button class="danger" id="del">Borrar actividad</button></div>`;
  $("bar").hidden=false;refresh();
}
function renderInst(){
  if(!cur.fecha)cur.fecha=dayKey(cur.creado);
  $("app").innerHTML=`
  <div class="top"><button class="back" data-back>${ICON.back}Actividades</button><span class="saved" id="saved"></span></div>
  <div class="top"><h1>Instalación alámbrica</h1><div class="chips">${chip("estado","pendiente","Pendiente","no")}${chip("estado","terminada","Terminada")}</div></div>

  <section class="sec"><div class="sec-h"><h2>Datos de la oficina</h2><span class="step">01</span></div>
    <label class="f">Pega aquí el mensaje de la secretaria<textarea id="f-pegado" data-k="pegado" placeholder="Tecnico: …&#10;Instalación&#10;Cliente: …&#10;Dirección: …&#10;IP: …&#10;Telef.: …">${esc(cur.pegado)}</textarea></label>
    <button class="pastebtn" id="pasteBtn">Pegar del portapapeles</button>
    <div class="grid">
      ${inp("tecnico","Técnico")}${inp("tecnico2","Segundo técnico (cuadrilla)",{attrs:'placeholder="Opcional"'})}
      <label class="f full">Fecha<input type="date" id="f-fecha" data-k="fecha" value="${esc(cur.fecha)}"></label>
    </div></section>

  <section class="sec"><div class="sec-h"><h2>Cliente</h2><span class="step">02</span></div>
    <div class="grid">
      ${inp("cliente","Nombres completos",{cls:"full",attrs:'autocapitalize="words"'})}
      ${inp("cedula","Cédula",{attrs:'inputmode="numeric" class="mono" maxlength="13"'})}${inp("tel","Teléfono",{attrs:'inputmode="tel" class="mono"'})}
      <div class="chips full" id="telChips"></div>
      <div class="chips full"><span class="muted" style="align-self:center">Correo:</span>${chip("correoEstado","tiene","Tiene correo")}${chip("correoEstado","no","No tiene","no")}</div>
      ${inp("correo","Correo electrónico",{cls:"full",attrs:'type="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"'})}
      ${inp("direccion","Dirección",{cls:"full"})}
      ${inp("plan","Plan",{unit:"Mbps",attrs:'inputmode="numeric" class="mono" placeholder="200"'})}${inp("ip","IP",{attrs:'inputmode="decimal" class="mono"'})}
    </div></section>

  <section class="sec"><div class="sec-h"><h2>Red y potencia</h2><span class="step">03</span></div>
    <div class="grid">
      ${inp("nap","NAP",{cls:"full",attrs:'class="mono" autocapitalize="characters" placeholder="B04-1"'})}
      ${inp("hilo","Hilo",{attrs:'inputmode="numeric" class="mono"'})}${inp("hilosLibres","Hilos libres",{attrs:'inputmode="numeric" class="mono"'})}
      ${inp("pot","Potencia",{unit:"dBm",attrs:'inputmode="decimal" class="mono" placeholder="-14.50"'})}${inp("metros","Fibra usada",{unit:"m",attrs:'inputmode="numeric" class="mono" placeholder="103"'})}
    </div></section>

  <section class="sec"><div class="sec-h"><h2>Equipos</h2><span class="step">04</span></div>
    <div class="chips"><button class="chip" data-tog="onu" aria-pressed="${!!cur.onu}">Bridge nuevo</button><button class="chip" data-tog="router" aria-pressed="${!!cur.router}">Router nuevo</button></div>
    <div class="grid">
      ${inp("mac","Mac ONT actual",{attrs:'class="mono" autocapitalize="characters" placeholder="EC-B9-31-…"'})}${inp("gpon","GPON SN",{attrs:'class="mono" autocapitalize="characters"'})}
    </div>
    <div class="box" id="boxRouter" ${cur.router?"":"hidden"}><div class="sec-h"><h3>Configuración del router</h3><span class="progress" id="rprog"></span></div>
      <div class="list-chk">${ROUTER.map(([k,l])=>chk(k,l,"","rchk")).join("")}</div></div>
  </section>

  <section class="sec"><div class="sec-h"><h2>Notas</h2><span class="step">05</span></div>
    <div class="list-chk">${chk("pruebas","Pruebas de potencia y test de velocidad","Agrega: el cliente cuenta con servicio de internet")}</div>
    <label class="f">Otras notas, una por línea; cada una sale con *<textarea id="f-notas" data-k="notas">${esc(cur.notas)}</textarea></label>
    <p class="muted" style="margin:0">Los metros de fibra y los equipos nuevos se agregan solos a las notas.</p>
  </section>
  ${notifHTML()}

  <section class="sec"><div class="sec-h"><h2>Checklist y evidencias</h2><span class="progress" id="eprog"></span></div>
    <p class="muted" style="margin:0">Solo para acordarte (fotos y stickers); las fotos van al WhatsApp.</p>
    <div class="list-chk">${EVID_I.map(([k,l,c])=>`<div data-eq="${c||""}" ${c==="eq"&&!(cur.onu||cur.router)?"hidden":""}>${chk(k,l,"","evid")}</div>`).join("")}</div>
  </section>

  <section class="sec"><div class="sec-h"><h2>Reporte</h2><span class="step">06</span></div><pre class="report" id="rep"></pre></section>

  <div class="top"><span class="muted">Creada ${fDay(dayKey(cur.creado))}, ${hhmm(cur.creado)}</span><button class="danger" id="del">Borrar actividad</button></div>`;
  $("bar").hidden=false;refresh();
}
const telNums=t=>(String(t||"").match(/\+?\d[\d\s-]{5,}\d/g)||[]).map(x=>x.trim());
function telChips(){const box=$("telChips");if(!box)return;const n=telNums(cur.tel);
  box.hidden=n.length<2;
  box.innerHTML=n.length<2?"":`<span class="muted" style="align-self:center">Toca ✕ para quitar:</span>`+n.map((x,i)=>`<button class="chip num" data-deltel="${i}" aria-label="Quitar ${esc(x)}"><span class="mono">${esc(x)}</span> <b aria-hidden="true">✕</b></button>`).join("");}
function mapLink(){const ta=$("f-pegado");if(!ta)return;let el=$("mapLink");
  if(!el){el=document.createElement("p");el.id="mapLink";el.className="muted";el.style.margin="0";ta.closest("label").after(el)}
  el.hidden=!cur.mapa;el.innerHTML=cur.mapa?`📍 Ubicación detectada (no va en el reporte): <a href="${esc(cur.mapa)}" target="_blank" rel="noopener">Abrir en Maps</a>`:""}
function refresh(){
  if(!cur)return;
  if(cur.tipo==="tv"){telChips();mapLink();const p=$("tvprog");if(p)p.textContent=`${TVSTEPS.filter(([k])=>cur.tvchk?.[k]).length}/${TVSTEPS.length}`;
    $("rep").textContent=report(cur);const nb=$("notifBox");if(nb)nb.hidden=cur.notif!=="si";
    $("miss").textContent=NOAPK[cur.tvSO]&&!cur.tvBox?"Recomendar TV Box o Fire TV Stick":cur.tvApp?"✓ Listo para copiar":"Elige la app";{const ok=!!cur.tvApp||(NOAPK[cur.tvSO]&&!cur.tvBox);$("miss").classList.toggle("ok",ok);$("copy").classList.toggle("ready",ok)}return}telChips();mapLink();
  {const nb=$("notifBox");if(nb)nb.hidden=cur.notif!=="si"}
  {const c=$("f-correo");if(c)c.closest("label").hidden=cur.correoEstado==="no"}
  $("rep").textContent=report(cur);
  const {m,r}=missing(cur);
  const total=(cur.tipo==="instalacion"?EVID_I:EVID).filter(([,,c])=>c!=="eq"||cur.onu||cur.router).length;
  $("eprog").textContent=`${total-m.length}/${total}`;
  if($("rprog"))$("rprog").textContent=`${ROUTER.length-r}/${ROUTER.length}`;
  $("miss").textContent=r?`Router: faltan ${r} ajustes`:m.length?`Faltan ${m.length} pendientes`:"✓ Todo listo";
  {const ok=!r&&!m.length;$("miss").classList.toggle("ok",ok);$("copy").classList.toggle("ready",ok)}
  const hb=(id,v)=>{const e=$(id);if(e)e.hidden=v};hb("boxFibra",!cur.fibra);hb("boxOnu",!cur.onu);hb("boxRouter",!cur.router);
  document.querySelectorAll('[data-eq="eq"]').forEach(e=>e.hidden=!(cur.onu||cur.router));
}

/* --- guardar --- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(acts))}catch(e){throw new Error("storage")}}
function queueSave(){clearTimeout(saveT);const s=$("saved");if(s)s.textContent="Guardando…";saveT=setTimeout(saveNow,600)}
async function saveNow(){clearTimeout(saveT);if(!cur)return;const {id,...data}=cur;data.actualizado=Date.now();
  const i=acts.findIndex(a=>a.id===id);if(i>=0)acts[i]={...cur};
  try{saveLocal();const s=$("saved");if(s)s.textContent="Guardado "+hhmm(Date.now())}
  catch{const s=$("saved");if(s)s.textContent="No se pudo guardar: el teléfono no tiene espacio."}}
async function remove(id){acts=acts.filter(a=>a.id!==id);saveLocal()}

async function newAct(tipo){
  const a=blank(tipo);let id="l"+a.creado;
  cur={id,...a};acts.push({...cur});renderEditor();window.scrollTo(0,0);
  $("f-pegado").focus();await saveNow();
}
async function back(){
  if(cur){const empty=!cur.pegado&&!cur.cliente&&!cur.trabajo&&!cur.ip&&!cur.notas&&!cur.tvSO;
    if(empty)await remove(cur.id).catch(()=>{});else await saveNow();}
  cur=null;renderList();window.scrollTo(0,0);
}

/* --- eventos --- */
document.addEventListener("input",e=>{
  if(!cur)return;const t=e.target;
  if(t.dataset.k){let v=t.value;
    if(/^(onuAnt|onuNueva|routerAnt|routerNueva|nap|mac|gpon)$/.test(t.dataset.k)){const p=t.selectionStart;v=v.toUpperCase();t.value=v;t.setSelectionRange(p,p)}
    cur[t.dataset.k]=v;
    if(t.dataset.k==="pegado"){const p=parse(v);cur.mapa=p.mapa;for(const k of ["tecnico","soporte","cliente","direccion","tel","ip","extra","cedula","correo","plan","nap"]){if(cur.tipo==="instalacion"&&k==="extra")continue;if(!p[k]&&["cedula","correo","plan","nap"].includes(k))continue;cur[k]=p[k];const el=$("f-"+k);if(el)el.value=p[k]}}
    refresh();queueSave();}
});
document.addEventListener("change",e=>{
  if(!cur)return;const t=e.target;if(!t.dataset.c)return;
  if(t.dataset.g){(cur[t.dataset.g]??={})[t.dataset.c]=t.checked}else cur[t.dataset.c]=t.checked;
  refresh();queueSave();
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;renderList();window.scrollTo(0,0);return}
  if(b.dataset.new)return newAct(b.dataset.new);
  if(b.dataset.open){const a=acts.find(x=>x.id===b.dataset.open);if(a){cur=JSON.parse(JSON.stringify(a));renderEditor();window.scrollTo(0,0)}return}
  if("back" in b.dataset)return back();
  if(b.dataset.deltel){const n=telNums(cur.tel);n.splice(+b.dataset.deltel,1);cur.tel=n.join(" / ");const el=$("f-tel");if(el)el.value=cur.tel;refresh();queueSave();return}
  if(b.dataset.marca){const m=b.dataset.marca;cur.tvMarca=cur.tvMarca===m?"":m;const so=(MARCAS.find(x=>x[0]===m)||[])[1];if(cur.tvMarca&&so)cur.tvSO=so;renderTV();queueSave();return}
  if(b.dataset.tvapp!==undefined){cur.tvApp=cur.tvApp===b.dataset.tvapp?"":b.dataset.tvapp;document.querySelectorAll("[data-tvapp]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tvapp===cur.tvApp)));refresh();queueSave();return}
  if(b.id==="addApp"){const v=$("newApp").value.trim();if(!v)return;cur.tvApp=v;renderTV();queueSave();return}
  if(b.dataset.tog){const k=b.dataset.tog;cur[k]=!cur[k];b.setAttribute("aria-pressed",String(cur[k]));refresh();queueSave();return}
  if(b.dataset.chip){const k=b.dataset.chip,v=b.dataset.v;cur[k]=(cur[k]===v&&k!=="estado")?"":v;
    if(/^(tvSO|tvBox)$/.test(k)){renderTV();queueSave();return}
    if(k==="tvFmt"&&!cur.tvFmt)cur.tvFmt=v;
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",String(cur[k]===x.dataset.v)));refresh();queueSave();return}
  if(b.id==="del"){if(!confirmDel){confirmDel=true;b.textContent="Toca otra vez para borrar";return}
    const id=cur.id;cur=null;try{await remove(id)}catch{}renderList();return}
});
const TIPO_TXT={foco_rojo:"Foco rojo",instalacion:"Instalación alámbrica",tv:"App de TV"};
function actividadTxt(a){
  if(a.soporte&&a.soporte.trim())return a.soporte.trim();
  return a.tipo==="instalacion"?"instalación nueva":a.tipo==="tv"?"colocar app de TV":"foco rojo";
}
function resumenDia(k){
  const list=acts.filter(a=>dayKey(a.creado)===k).sort((a,b)=>a.creado-b.creado);
  const hoy=k===dayKey(Date.now());
  const out=[hoy?"Se cumplieron con las siguientes actividades de hoy:":`Se cumplieron con las siguientes actividades del ${fechaLarga(k)}:`];
  for(const a of list){const L=["✅soporte, "+actividadTxt(a)];
    if(a.cliente)L.push("cliente, "+a.cliente);
    if(a.tel)L.push("tel. "+a.tel);
    if(a.ip)L.push("ip, "+a.ip);
    out.push(L.join("\n"));}
  return out.join("\n\n");
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}
  catch{const c=$("clip");c.value=txt;c.select();c.setSelectionRange(0,txt.length);try{return document.execCommand("copy")}catch{return false}}
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-copyday]");if(!b)return;e.stopPropagation();
  const ok=await copyText(resumenDia(b.dataset.copyday));b.innerHTML=ok?"Copiado ✓":"No se pudo copiar";setTimeout(()=>b.innerHTML=ICON.copy+"Copiar resumen",2200)},true);
$("copy").onclick=async()=>{
  if(!cur)return;const txt=report(cur);const btn=$("copy").querySelector("span");
  try{await navigator.clipboard.writeText(txt);btn.textContent="Copiado ✓"}
  catch{const c=$("clip");c.value=txt;c.select();c.setSelectionRange(0,txt.length);
    try{document.execCommand("copy");btn.textContent="Copiado ✓"}catch{btn.textContent="Mantén presionado el reporte para copiar"}}
  setTimeout(()=>btn.textContent="Copiar reporte",2200);
  if(cur.estado!=="terminada"&&cur.cumplida){cur.estado="terminada";document.querySelectorAll('[data-chip="estado"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v==="terminada")));queueSave()}
};

/* --- respaldo --- */
async function exportar(){
  const data=JSON.stringify({app:"actividades",version:1,exportado:new Date().toISOString(),actividades:acts},null,1);
  const name="actividades-"+dayKey(Date.now())+".json";
  const file=new File([data],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});$("bkMsg").textContent="Copia lista. Guárdala en Archivos o iCloud.";return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  $("bkMsg").textContent="Copia descargada: "+name;
}
async function importar(f){
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.actividades;if(!Array.isArray(list))throw 0;
    const byId=new Map(acts.map(a=>[a.id,a]));let n=0;
    for(const a of list){if(!a||!a.id)continue;const o=byId.get(a.id);if(!o||(a.actualizado||0)>(o.actualizado||0)){byId.set(a.id,a);n++}}
    acts=[...byId.values()];saveLocal();renderList();$("bkMsg").textContent=`Copia importada: ${n} actividades nuevas o actualizadas.`;
  }catch{$("bkMsg").textContent="Ese archivo no es una copia válida de Actividades."}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="expBtn")return exportar();
  if(b.id==="pasteBtn"){try{const t=await navigator.clipboard.readText();const ta=$("f-pegado");if(!t||!ta)return;ta.value=t;ta.dispatchEvent(new Event("input",{bubbles:true}))}catch{b.textContent="Mantén presionado el cuadro y elige Pegar";setTimeout(()=>b.textContent="Pegar del portapapeles",2500)}}
});
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files[0]){importar(e.target.files[0]);e.target.value=""}});

/* --- arranque --- */
try{acts=JSON.parse(localStorage.getItem(LS)||"[]")}catch{acts=[]}
renderList();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator){
  navigator.serviceWorker.ready.then(()=>{offReady=true;const o=$("offState");if(o)o.innerHTML='<span class="offok">✓ Lista para usar sin internet</span>'});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=w=>{$("upd").hidden=false;$("updBtn").onclick=()=>w.postMessage("skip")};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||!hadCtl)return;reloaded=true;if(cur)saveNow();location.reload()});
}
</script>
