<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actividades de Campo</title>
<meta name="description" content="Registro personal de actividades técnicas: foco rojo, instalación alámbrica y app de TV.">
<meta name="theme-color" content="#0c0716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Actividades">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Sora";font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#0c0716}
body{margin:0}
/* Layout: columna para el teléfono, siempre oscuro neón; pestañas en barra flotante abajo, copiar en la misma isla */
:root{color-scheme:dark;
  --bg:#0c0716; --card:rgba(22,13,40,.62); --card-solid:#160d28; --fg:#ffffff; --muted:#a99fc4; --line:rgba(255,255,255,.09); --field:rgba(0,0,0,.32);
  --purple:#a855f7; --purple-d:#9333ea; --fuchsia:#e879f9; --pink:#ff2e7a; --cyan:#22d3ee; --green:#2ee88a; --amber:#fbbf24; --orange:#ff8a1f; --blue:#60a5fa;
  --red:var(--pink); --ok:var(--green); --warn:var(--amber); --accent:var(--purple); --on-color:#ffffff;
  --display:"Sora",system-ui,sans-serif; --sans:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{color:var(--fg);font:16px/1.45 var(--sans);min-height:100vh;
  background:radial-gradient(90% 40% at 0% 0%,rgba(147,51,234,.38),transparent 70%),radial-gradient(70% 35% at 100% 45%,rgba(232,121,249,.16),transparent 70%),radial-gradient(90% 35% at 0% 100%,rgba(34,211,238,.1),transparent 70%),var(--bg);background-attachment:fixed}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 30px/1.08 var(--display);letter-spacing:-.03em;margin:0}
h2{font:600 15px var(--display);letter-spacing:-.01em;color:var(--fg);margin:0}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .15s,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:600}
/* resumen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat b{display:block;font:700 24px var(--display);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.g b{color:var(--green);text-shadow:0 0 12px rgba(46,232,138,.5)}.stat.a b{color:var(--amber)}
/* baldosas de crear */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{--c:var(--purple);border-radius:18px;padding:12px 6px 10px;display:grid;justify-items:center;gap:7px;text-align:center;font-weight:700;font-size:13px;line-height:1.15;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(20,12,36,.6));border:1.5px solid color-mix(in srgb,var(--c) 85%,transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.12)}
.tile:active{box-shadow:0 0 30px var(--c),inset 0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.tile i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 0 14px var(--c)}
.tile.red{--c:var(--pink)}.tile.tv{--c:var(--cyan)}.tile.tv i{color:#03151a}
.searchbox{display:flex;align-items:center;gap:10px;border-radius:14px;padding:0 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.search{flex:1;min-width:0;font:inherit;padding:12px 0;border:0;background:transparent;color:var(--fg);outline:none}
.day{display:grid;gap:10px}
.day-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.day-top h2{margin:0}
.pill,.copyday{--c:var(--fuchsia);display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;
  border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.pill svg,.copyday svg{width:15px;height:15px}
/* historial por mes y día */
details.month,details.dayd{border-radius:20px;background:var(--card);border:1px solid rgba(168,85,247,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
details.dayd{border-radius:18px;background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.09)}
details.dayd[open]{border-color:rgba(232,121,249,.45);box-shadow:0 0 14px rgba(232,121,249,.18)}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;-webkit-tap-highlight-color:transparent}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";font:700 20px/1 var(--display);color:var(--fuchsia);width:14px;transition:transform .15s;text-shadow:0 0 8px rgba(232,121,249,.6)}
details[open]>summary::before{transform:rotate(90deg)}
details>summary .l{flex:1;min-width:0}
details.month>summary .l{font:700 18px var(--display);letter-spacing:-.01em}
.cnt{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.cnt em{font-style:normal;color:var(--amber)}
details.dayd .l .cnt{display:block;margin-top:2px}
details.year{border-color:rgba(232,121,249,.45);box-shadow:0 0 14px rgba(232,121,249,.12)}
details.year>summary .l{font:700 22px var(--display)}
details.year>.mdays>details.month{background:rgba(0,0,0,.2)}
.today{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#04140a;background:var(--green);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px;box-shadow:0 0 8px rgba(46,232,138,.5)}
.mdays{padding:0 10px 10px;display:grid;gap:10px}
.dbody{padding:0 10px 12px;display:grid;gap:10px}
.dtools{display:flex;justify-content:flex-end}
/* no realizada y pendientes viejas */
.chip.bad[aria-pressed="true"]{background:rgba(255,46,122,.22);border-color:var(--pink);color:#fff;box-shadow:0 0 12px rgba(255,46,122,.5)}
.sec.nr.on{border-color:rgba(255,46,122,.6);box-shadow:0 0 14px rgba(255,46,122,.25)}
.pend{border-radius:20px;padding:14px;display:grid;gap:10px;background:rgba(251,191,36,.08);border:1.5px solid rgba(251,191,36,.6);box-shadow:0 0 16px rgba(251,191,36,.2)}
.pend-h{font:700 15px var(--display);color:#fde68a}
.pend-row{display:grid;gap:8px}
.pasar{justify-self:end;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:#1a1205;border:0;background:var(--amber);box-shadow:0 0 14px rgba(251,191,36,.55)}
/* jornada */
.dock button{font-size:10.5px}
.clock{display:grid;justify-items:center;gap:8px}
.dial{--p:0;width:min(220px,64vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(closest-side,#120a20 86%,transparent 87% 100%),conic-gradient(from -90deg,var(--green),var(--cyan) calc(var(--p)*1%),rgba(255,255,255,.08) 0);box-shadow:0 0 30px rgba(46,232,138,.22)}
.time{font:600 36px/1 var(--mono);font-variant-numeric:tabular-nums}.time small{font-size:15px;color:var(--muted)}
.worked{display:block;font:700 13px var(--display);color:var(--green);margin-top:6px}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#e6defa}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.state.on .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch{--c:var(--green);border-radius:20px;padding:14px;display:grid;gap:4px;justify-items:start;text-align:left;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(20,12,36,.6));border:1.5px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.12)}
.punch.out{--c:var(--orange)}.punch.next{box-shadow:0 0 30px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.punch i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#06110b;box-shadow:0 0 12px var(--c)}.punch b{font:700 16px var(--display)}.punch small{font-size:12px;color:#d7cfea}
.lunchbtn{width:100%;border-radius:18px;padding:13px;font-weight:700;font-size:15px;border:1.5px solid var(--amber);background:rgba(251,191,36,.12);box-shadow:0 0 14px rgba(251,191,36,.35)}.lunchbtn small{font-weight:500;color:#fde68a}
.multi{border-radius:18px;padding:14px;display:grid;gap:10px;border:1.5px solid var(--cyan);background:rgba(34,211,238,.08);box-shadow:0 0 16px rgba(34,211,238,.25)}
.multi h3{margin:0;font:700 15px var(--display)}.multi ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.multi-a,.lotenav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lotenav{justify-content:space-between}
.mgo{font-weight:700;border:0;color:#03151a;background:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.5);border-radius:14px;padding:11px 14px}
.gpsrow{display:flex}.gpsbtn.bad{border-color:var(--pink);background:rgba(255,46,122,.12);box-shadow:0 0 12px rgba(255,46,122,.4);color:#ffc2d6}.gpsbtn{font-weight:700;font-size:14px;border:1.5px solid var(--cyan);background:rgba(34,211,238,.1);box-shadow:0 0 12px rgba(34,211,238,.35);border-radius:14px;padding:9px 14px}
.lunchbtn.off{opacity:.55;box-shadow:none}
.lunch{border-radius:20px;padding:14px;display:grid;gap:12px;border:1.5px solid var(--amber);background:rgba(251,191,36,.1);box-shadow:0 0 18px rgba(251,191,36,.3)}
.lunch.late{border-color:var(--pink);background:rgba(255,46,122,.12);box-shadow:0 0 18px rgba(255,46,122,.4)}
.lunch-h{display:grid;gap:4px}.lunch-h b{font:700 15px var(--display)}.lunch-h span{font:600 14px var(--mono);color:#fde68a}.lunch.late .lunch-h span{color:#ffc2d6}
.lunch-a{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alarm{display:flex;align-items:center;justify-content:center;border-radius:14px;padding:11px;font-weight:700;color:#fff;text-decoration:none;border:1px solid var(--line);background:var(--card)}
.punch-r{border-radius:14px;padding:11px;font-weight:700;color:#03151a;border:0;background:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.5)}
.tg.l{color:var(--amber);border:1px solid var(--amber);background:rgba(251,191,36,.15)}.tg.r{color:var(--cyan);border:1px solid var(--cyan);background:rgba(34,211,238,.15)}
.mnote{width:100%;font:inherit;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg)}.mnote::placeholder{color:#6f6590}
.hint{font-size:13px;color:#d7cfea;padding:10px 12px;border-radius:14px;background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.45)}
.total{font:600 14px var(--mono);color:#f5d0fe}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.mrow .hr{font:600 15px var(--mono);min-width:0}.mrow .hr small{display:block;font:400 12.5px var(--sans);color:var(--muted)}
.tg{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.tg.e{color:var(--green);border:1px solid var(--green);background:rgba(46,232,138,.15)}.tg.s{color:var(--orange);border:1px solid var(--orange);background:rgba(255,138,31,.15)}
.macts{display:flex;gap:6px}.mini{padding:6px 11px;font-size:13px;font-weight:700;border-radius:99px;border:1.5px solid rgba(168,85,247,.55);background:rgba(168,85,247,.1)}
.medit{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid rgba(168,85,247,.3)}
.medit input,.medit select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
.sal{font:700 13px var(--mono);font-style:normal;color:var(--orange)!important}
.ult{--c:var(--purple);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ult.t-potencia{--c:var(--orange)}.ult.t-foco_rojo{--c:var(--pink)}.ult.t-tv{--c:var(--cyan)}
.ult .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ult small{display:block;color:var(--muted);font-size:12px;font-weight:600}.ult b{font-size:14.5px;overflow-wrap:anywhere}
@media (max-width:420px){.mrow{grid-template-columns:auto 1fr}.macts{grid-column:1/-1;justify-content:flex-end}}
/* tarjetas */
.item{--c:var(--purple);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:18px;
  background:var(--card);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 16%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.item.t-foco_rojo{--c:var(--pink)}.item.t-tv{--c:var(--cyan)}.item.t-potencia{--c:var(--orange)}
.tiles{grid-template-columns:repeat(2,1fr)}.tile{grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center;padding:12px}
.tile.pot{--c:var(--orange)}.tile.ret{--c:var(--blue);grid-column:1/-1}.tile.ret i{color:#06121f}.item.t-retiro,.ult.t-retiro{--c:var(--blue)}.tile.pot i{color:#1a0c00}
.pv{font:700 12.5px var(--mono);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pv.r{color:#ffc2d6;background:rgba(255,46,122,.18);border:1px solid var(--pink)}
.pv.a{color:#fde68a;background:rgba(251,191,36,.16);border:1px solid var(--amber)}
.pv.g{color:#bff7d8;background:rgba(46,232,138,.16);border:1px solid var(--green)}
input.pin-r{border-color:var(--pink)!important;box-shadow:0 0 10px rgba(255,46,122,.35)}
input.pin-a{border-color:var(--amber)!important;box-shadow:0 0 10px rgba(251,191,36,.35)}
input.pin-g{border-color:var(--green)!important;box-shadow:0 0 10px rgba(46,232,138,.35)}
.gain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}.gain .arrow{color:var(--muted)}
.delta{margin-left:auto;font:700 18px var(--display)}.delta.up{color:var(--green);text-shadow:0 0 12px rgba(46,232,138,.6)}.delta.down{color:var(--pink)}
.gtab{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px 10px;align-items:center;font-size:13px}.gtab>b{color:var(--muted);font-weight:600}.gtab .delta{margin:0;font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.legend .g{background:var(--green)}.legend .a{background:var(--amber)}.legend .r{background:var(--pink)}
.item .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.item b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.item small{color:#ddd5f2;font:400 12.5px var(--mono)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d);box-shadow:0 0 8px var(--d)}
.st.ok{--d:var(--green);color:#bff7d8}.st.no{--d:var(--pink);color:#ffc2d6}.st.wait{--d:var(--amber);color:#fde7a8}
.empty{background:var(--card);border:1px dashed rgba(168,85,247,.45);border-radius:18px;padding:24px 16px;color:var(--muted);text-align:center}
.muted{color:var(--muted);font-size:14px}
/* barra flotante (pestañas o copiar) */
.dock,.bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;
  max-width:656px;margin:0 auto;border-radius:24px;padding:8px;display:flex;gap:8px;align-items:center;
  background:rgba(20,12,36,.72);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.dock button{flex:1;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:16px;background:transparent;border:0}
.dock button[aria-current="page"]{color:#fff;background:rgba(168,85,247,.22);box-shadow:inset 0 0 0 1px rgba(192,132,252,.5),0 0 14px rgba(168,85,247,.35)}
.bar-in{display:flex;gap:10px;align-items:center;width:100%}
.bar .note{font-size:12.5px;font-weight:700;color:var(--amber);max-width:42%;padding-left:6px;line-height:1.25}
.bar .note.ok{color:var(--green)}
.primary{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;border-radius:18px;padding:14px;font:700 15px var(--display);color:#fff;border:0;
  background:linear-gradient(135deg,var(--purple-d),var(--fuchsia));box-shadow:0 0 18px rgba(232,121,249,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.primary.ready{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(232,121,249,1),0 0 70px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.35)}}
@media (prefers-reduced-motion:reduce){.primary.ready{animation:none}}
/* editor */
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px 8px 8px;border-radius:99px;font-weight:700;font-size:14px}
.sec{background:var(--card);border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:16px;display:grid;gap:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-h h2{font-size:16px}

function parse(txt){
  const out={tecnico:"",soporte:"",cliente:"",direccion:"",tel:"",ip:"",cedula:"",correo:"",plan:"",nap:"",hilo:"",potAntes:"",coords:"",extra:[]};
  const MAPRE=/(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|g\.co\/kgs)\S*/gi;
  out.mapa="";
  for(const raw of txt.split(/\r?\n/)){let l=raw.trim();if(!l)continue;
    const mm=l.match(MAPRE);if(mm){if(!out.mapa)out.mapa=mm[0].startsWith("http")?mm[0]:"https://"+mm[0];l=l.replace(MAPRE,"").trim();
      if(!l||/^(ubicaci[oó]n|ubicaci[oó]n del cliente|maps?|google maps|link|enlace|direcci[oó]n en maps)\s*[,.:]*$/i.test(l))continue;l=l.replace(/[\s,.:\-]+$/,"");if(!l)continue}
    {const nm=l.match(/^nap\s*[,.:]?\s*([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)\s*(?:[,;/]?\s*(?:h(?:ilo)?)\s*[:.#]?\s*(\d+))?\s*$/i);
      if(nm){out.nap=nm[1].toUpperCase();if(nm[2])out.hilo=nm[2];continue}
      const cm=l.match(/^coordenadas?\s*[,.:]?\s*(.+)$/i);if(cm){out.coords=cm[1].trim();continue}
      {const nn=l.match(/^([A-Za-z]{1,4}\d{1,4}-\d{1,3})\s*(?:[,;/]?\s*h(?:ilo)?\s*[:.#]?\s*(\d+))?\s*$/i);if(nn){out.nap=nn[1].toUpperCase();if(nn[2])out.hilo=nn[2];continue}}
      const hm=l.match(/^hilo\s*[,.:#]?\s*(\d+)\s*$/i);if(hm){out.hilo=hm[1];continue}
      const pm=l.match(/^potencia(?:\s+actual)?\s*[,.:]?\s*(-?\s*\d+(?:[.,]\d+)?)\s*(?:dbm)?\s*$/i);
      if(pm){out.potAntes=pm[1].replace(/\s/g,"").replace(",",".");continue}}
    const m=l.match(/^(t[eé]cnicos?|soporte|cliente|direcci[oó]n|tel[eé]fono|tel[eé]f|tel|celular|cel|ip|c[eé]dula|correo(?: electr[oó]nico)?|plan|nap)\s*[,.:]+\s*(.*)$/i);
    if(!m){if(!/^instalaci[oó]n\.?$/i.test(l))out.extra.push(l);continue}
    const k=m[1].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

    out[key]=m[2].trim();}
  out.extra=out.extra.join("\n");return out;
}

    const finish=()=>{if(done)return;done=true;navigator.geolocation.clearWatch(wid);clearTimeout(tm);delete b.dataset.busy;b.disabled=false;
      if(!best){b.textContent="No se pudo obtener la ubicación. Intenta de nuevo al aire libre";b.classList.add("bad");return}
      const {latitude:la,longitude:lo,accuracy:ac}=best;cur.coords=toDMS(la,"N","S")+" "+toDMS(lo,"E","W");const el=$("f-coords");if(el)el.value=cur.coords;
      const good=ac<=50;b.classList.toggle("bad",!good);
      b.textContent=good?`📍 Ubicación lista (±${Math.round(ac)} m) · tocar para actualizar`:`⚠️ Ubicación aproximada (±${Math.round(ac)} m): sal al aire libre y toca otra vez`;
      refresh();queueSave()};
    const wid=navigator.geolocation.watchPosition(pos=>{if(!best||pos.coords.accuracy<best.accuracy)best={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};
        b.textContent=`📍 Afinando precisión… ±${Math.round(best.accuracy)} m`;if(best.accuracy<=12||(best.accuracy<=25&&Date.now()-t0>5000))finish()},
      err=>{if(err.code===1){done=true;navigator.geolocation.clearWatch(wid);clearTimeout(tm);delete b.dataset.busy;b.disabled=false;b.classList.add("bad");b.textContent="Permiso de ubicación negado: actívalo en Ajustes › Apps › Safari › Ubicación"}},
      {enableHighAccuracy:true,timeout:15000,maximumAge:0});
    const tm=setTimeout(finish,15000);return}
  if(b.dataset.motivo&&cur){const n=(cur.cliente||"").replace(/\s*\(.*?\)\s*/g," ").replace(/_/g," ").trim()||"el cliente";
    const tel=(cur.tel||"").split("/")[0].trim();
    cur.motivo=`Se acudió al domicilio del cliente ${n}; los vecinos aledaños nos comentan que no se encuentra en casa en este momento.`+(tel?` Se intentó comunicar al número ${tel} sin obtener respuesta.`:"")+` Queda pendiente reagendar la visita.`;
    const m=$("f-motivo");if(m){m.value=cur.motivo;m.focus()}refresh();queueSave();return}
  if(b.dataset.multi){if(b.dataset.multi==="crear")return multiCreate();const m=$("multiBox");if(m)m.remove();multi=null;return}
  if(b.dataset.next){await saveNow();const a=acts.find(x=>x.id===b.dataset.next);if(a){cur=JSON.parse(JSON.stringify(a));renderEditor();window.scrollTo(0,0)}return}
  if(b.dataset.medit){mEdit=mEdit===b.dataset.medit?null:b.dataset.medit;mConf=null;renderList();return}
  if(b.dataset.mdel){if(mConf===b.dataset.mdel){marks=marks.filter(m=>m.id!==b.dataset.mdel);mConf=null;try{saveMarks()}catch{}}else mConf=b.dataset.mdel;renderList();return}
  if("mcancel" in b.dataset){mEdit=null;renderList();return}
  if(b.dataset.new)return newAct(b.dataset.new);
  if(b.dataset.open){const a=acts.find(x=>x.id===b.dataset.open);if(a){cur=JSON.parse(JSON.stringify(a));renderEditor();window.scrollTo(0,0)}return}
  if("back" in b.dataset)return back();
  if(b.dataset.deltel){const n=telNums(cur.tel);n.splice(+b.dataset.deltel,1);cur.tel=n.join(" / ");const el=$("f-tel");if(el)el.value=cur.tel;refresh();queueSave();return}
  if(b.dataset.marca){const m=b.dataset.marca;cur.tvMarca=cur.tvMarca===m?"":m;const so=(MARCAS.find(x=>x[0]===m)||[])[1];if(cur.tvMarca&&so)cur.tvSO=so;renderTV();queueSave();return}
  if(b.dataset.tvapp!==undefined){cur.tvApp=cur.tvApp===b.dataset.tvapp?"":b.dataset.tvapp;document.querySelectorAll("[data-tvapp]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tvapp===cur.tvApp)));refresh();queueSave();return}
  if(b.id==="addApp"){const v=$("newApp").value.trim();if(!v)return;cur.tvApp=v;renderTV();queueSave();return}
  if(b.dataset.real){cur.noRealizada=b.dataset.real==="no";if(cur.noRealizada)cur.estado="pendiente";
    document.querySelectorAll("[data-real]").forEach(x=>x.setAttribute("aria-pressed",String((x.dataset.real==="no")===cur.noRealizada)));
    document.querySelectorAll('[data-chip="estado"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===cur.estado)));
    refresh();queueSave();if(cur.noRealizada){const m=$("f-motivo");m&&m.focus()}return}
  if(b.dataset.pasar){const a=acts.find(x=>x.id===b.dataset.pasar);if(!a)return;
    a.reagendadoDe=a.reagendadoDe||dayKey(a.creado);a.creado=Date.now();a.noRealizada=false;a.estado="pendiente";if(a.tipo==="instalacion")a.fecha=dayKey(a.creado);a.actualizado=Date.now();
    try{saveLocal()}catch{}renderList();return}
  if(b.dataset.tog){const k=b.dataset.tog;cur[k]=!cur[k];b.setAttribute("aria-pressed",String(cur[k]));refresh();queueSave();return}
  if(b.dataset.chip){const k=b.dataset.chip,v=b.dataset.v;cur[k]=(cur[k]===v&&k!=="estado")?"":v;if(k==="estado"&&v==="terminada")cur.terminadaTs=Date.now();
    if(/^(tvSO|tvBox)$/.test(k)){renderTV();queueSave();return}
    if(k==="tvFmt"&&!cur.tvFmt)cur.tvFmt=v;
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",String(cur[k]===x.dataset.v)));refresh();queueSave();return}
  if(b.id==="del"){if(!confirmDel){confirmDel=true;b.textContent="Toca otra vez para borrar";return}
    const id=cur.id;cur=null;try{await remove(id)}catch{}renderList();return}
});
const TIPO_TXT={foco_rojo:"Foco rojo",instalacion:"Instalación alámbrica",tv:"App de TV",potencia:"Potencias elevadas",retiro:"Retiro de equipos"};
function actividadTxt(a){
  if(a.soporte&&a.soporte.trim())return a.soporte.trim();
  return a.tipo==="instalacion"?"instalación nueva":a.tipo==="tv"?"colocar app de TV":a.tipo==="potencia"?"mejorar potencia":a.tipo==="retiro"?"retiro de equipos":"foco rojo";
}
function resumenDia(k){
  const list=acts.filter(a=>dayKey(a.creado)===k).sort((a,b)=>a.creado-b.creado);
  const hoy=k===dayKey(Date.now());
  const out=[hoy?"Se cumplieron con las siguientes actividades de hoy:":`Se cumplieron con las siguientes actividades del ${fechaLarga(k)}:`];
  const blk=(a,first)=>{const L=[first+"soporte, "+actividadTxt(a)];
    if(a.cliente)L.push("cliente, "+a.cliente);
    if(a.tel)L.push("tel. "+a.tel);
    if(a.ip)L.push("ip, "+a.ip);return L};
  for(const a of list.filter(a=>!a.noRealizada))out.push(blk(a,"✅").join("\n"));
  for(const a of list.filter(a=>a.noRealizada)){const L=blk(a,"");L.unshift("⏳Pendiente, reagendar");if(a.motivo&&a.motivo.trim())L.push("Motivo: "+a.motivo.trim());out.push(L.join("\n"))}
  if(out.length===1)return out[0];
  return out.join("\n\n");
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}
  catch{const c=$("clip");c.value=txt;c.select();c.setSelectionRange(0,txt.length);try{return document.execCommand("copy")}catch{return false}}
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-copyday]");if(!b)return;e.stopPropagation();
  const ok=await copyText(resumenDia(b.dataset.copyday));b.innerHTML=ok?"Copiado ✓":"No se pudo copiar";setTimeout(()=>b.innerHTML=ICON.copy+"Copiar resumen",2200)},true);
$("copy").onclick=async()=>{
  if(!cur)return;const txt=report(cur);const btn=$("copy").querySelector("span");
  try{await navigator.clipboard.writeText(txt);btn.textContent="Copiado ✓"}
  catch{const c=$("clip");c.value=txt;c.select();c.setSelectionRange(0,txt.length);
    try{document.execCommand("copy");btn.textContent="Copiado ✓"}catch{btn.textContent="Mantén presionado el reporte para copiar"}}
  setTimeout(()=>btn.textContent="Copiar reporte",2200);
  if(cur.estado!=="terminada"&&cur.cumplida&&!cur.noRealizada){cur.estado="terminada";cur.terminadaTs=Date.now();document.querySelectorAll('[data-chip="estado"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v==="terminada")));queueSave()}
};

/* --- respaldo --- */
async function exportar(){
  const data=JSON.stringify({app:"actividades",version:2,exportado:new Date().toISOString(),actividades:acts,marcaciones:marks},null,1);
  const name="actividades-"+dayKey(Date.now())+".json";
  const file=new File([data],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});$("bkMsg").textContent="Copia lista. Guárdala en Archivos o iCloud.";return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  $("bkMsg").textContent="Copia descargada: "+name;
}
async function importar(f){
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:(j.actividades||[]);const ml=Array.isArray(j?.marcaciones)?j.marcaciones:[];
    if(!Array.isArray(list)||(!list.length&&!ml.length&&!Array.isArray(j)))throw 0;
    const byId=new Map(acts.map(a=>[a.id,a]));let n=0;
    for(const a of list){if(!a||!a.id)continue;const o=byId.get(a.id);if(!o||(a.actualizado||0)>(o.actualizado||0)){byId.set(a.id,a);n++}}
    acts=[...byId.values()];saveLocal();
    const ids=new Set(marks.map(m=>m.id));let nm=0;for(const m of ml){if(!m||!m.ts||!m.tipo)continue;const id=m.id||"l"+m.ts;if(ids.has(id))continue;marks.push({id,tipo:m.tipo,ts:m.ts,nota:m.nota||""});ids.add(id);nm++}
    if(nm)saveMarks();
    renderList();const bm=$("bkMsg");if(bm)bm.textContent=`Copia importada: ${n} actividades y ${nm} marcaciones nuevas.`;
  }catch{$("bkMsg").textContent="Ese archivo no es una copia válida de Actividades."}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="expBtn")return exportar();
  if(b.id==="pasteBtn"){try{const t=await navigator.clipboard.readText();const ta=$("f-pegado");if(!t||!ta)return;ta.value=t;ta.dispatchEvent(new Event("input",{bubbles:true}))}catch{b.textContent="Mantén presionado el cuadro y elige Pegar";setTimeout(()=>b.textContent="Pegar del portapapeles",2500)}}
});
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files[0]){importar(e.target.files[0]);e.target.value=""}});

document.addEventListener("submit",e=>{const f=e.target.closest("[data-mform]");if(!f)return;e.preventDefault();
  const ts=new Date($("me-d").value+"T"+$("me-t").value).getTime();if(isNaN(ts))return;const m=marks.find(x=>x.id===f.dataset.mform);
  if(m){m.ts=ts;m.tipo=$("me-k").value}mEdit=null;try{saveMarks()}catch{}renderList()});
/* --- arranque --- */
try{acts=JSON.parse(localStorage.getItem(LS)||"[]")}catch{acts=[]}
renderList();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator){
  navigator.serviceWorker.ready.then(()=>{offReady=true;const o=$("offState");if(o)o.innerHTML='<span class="offok">✓ Lista para usar sin internet</span>'});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=w=>{$("upd").hidden=false;$("updBtn").onclick=()=>w.postMessage("skip")};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||!hadCtl)return;reloaded=true;if(cur)saveNow();location.reload()});
}
</script>
